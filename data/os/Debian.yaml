---
# run-puppet hosts may lack facts.puppet_role; use the OS layer and an exact
# hostname allowlist. The diagnostic profile is included by the Talos role.
linux_network_diagnostics_enabled: true
linux_network_diagnostics_hosts:
  - t-linux64-ms-008

# Restore the old stopped/disabled NetworkManager state on one monitored control.
# Remove this hostname and converge to re-enable the 18.04 fix.
linux_network_manager_control_hosts:
  - t-linux64-ms-008
