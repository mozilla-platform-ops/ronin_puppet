---
ntp_server: time.apple.org

# Hangar reprovision-runner. NON-secret config only. The sensitive fields are
# dropped on the host in /var/root/vault.yaml (same as every worker; run-puppet.sh
# copies it to data/secrets/vault.yaml, the top hiera layer). Config here + secrets
# there share the `reprovision_runner` key and are combined with a DEEP merge, so
# neither shadows the other.
#
# Add this flat block to /var/root/vault.yaml on the runner host (NOT committed):
#   reprovision_runner:
#     tc_client_id:       <op://RelOps/Taskcluster Quarantine/username>
#     tc_access_token:    <op://RelOps/Taskcluster Quarantine/password>
#     simplemdm_api_key:  <op://RelOps/SimpleMDM API admin/password>
#     ssh_admin_password: <op://RelOps/DEP Provisioned Mac Admin Account SimpleMDM SSH/password>
#     ssh_admin_key: |    <op://RelOps/RelOps Worker Admin Key/notesPlain>  (PEM)
#     client_cert: |      mTLS cert — PEM leaf + intermediates (CN=<hostname>)
#     client_key: |       mTLS key — PEM
reprovision_runner:
  enabled: true
  # AUTO-RENEWING certs. step-ca is reachable from MDC1 by IP (verified 2026-07-10: TCP 443 +
  # /health 200); its hostname just isn't in MDC1 DNS, so step_ca_ip pins it in /etc/hosts. The
  # module then runs a `step ca renew --daemon` LaunchDaemon that rotates the cert within step-ca's
  # 24h provisioner cap — key generated on-host, nothing in vault. Replaces the manual
  # mint-runner-cert.sh reissue chore (relops-bootstrap#28).
  cert_mode: step_renew
  step_ca_ip: 34.61.3.27
  repo_revision: main
  runner_id: "%{facts.networking.hostname}"
  # Talk to Hangar's DEDICATED runner frontend (mTLS on its own hostname). The human/browser
  # frontend (hangar.relops.mozilla.com) no longer carries mTLS, so the runner MUST use this
  # host to reach /api/reprovision/runner/* + /api/screen/agent/*. See hangar PR #65.
  hangar_api_url: https://hangar-runner.relops.mozilla.com/api
  # step_ca_url uses the module default.

  # ---- tart VM slot health sweep (hangar-tart-health-agent) ----
  # Pushes per-slot health for gecko-t-osx-1500-m-vms to Hangar's /api/tart-health,
  # which the Tart VMs page renders. Runs here because Cloud Run cannot reach MDC1 and
  # this host already holds the mTLS cert and the admin SSH identity.
  #
  # Proven from this host 2026-07-30: {"accepted":26,"runner":"cert:macmini-m4-81"}.
  #
  # Interval must stay UNDER Hangar's 30 minute staleness window, or every row ages to
  # `unknown` between sweeps. 600s leaves plenty of margin for a slow sweep.
  tart_health_enabled: true
  tart_health_interval: 600
  # Guest probes (disk headroom, clock skew, worker identity) need an `expect` password
  # login into each VM and are much slower. They are also the checks that actually catch
  # a crash-looping guest inside a healthy host.
  #
  # ENABLED 2026-08-17. The host-level sweep is a lagging indicator and it has now cost
  # us twice: 12 of 26 slots were out of production on 08-13 and 7 more on 08-17, every
  # one of them found by sweeping the guests BY HAND. Registration in Taskcluster lags by
  # hours (`mac-b531d3` read `ok` in Hangar while it was already dead), whereas guest disk
  # headroom trends down for days beforehand — the two caches in
  # reclaim_worker_caches.sh cross generic-worker's 20 GiB floor and the slot starts an
  # 84s exit-69 reboot loop. Headroom is the only leading signal we have.
  #
  # Timing: 13 hosts at --concurrency 4, each host probing its 2 guests serially with a
  # 150s ssh timeout. Realistic sweep is ~140-400s, comfortably inside the 600s interval.
  # A wedged guest burns its full timeout (seen 2026-08-17: mac-866d5e's sshd accepted TCP
  # but never sent a banner), so a pathological sweep could reach ~1680s. That is still
  # under Hangar's 30 minute staleness window, and the loop simply runs back-to-back
  # rather than failing. The interval is deliberately left at 600s: raising it would not
  # improve staleness, since worst-case sweep DURATION is the binding constraint, not the
  # interval. If sweeps are observed to overrun in practice, raise it then, with data.
  tart_health_guests: true
  # The tart hosts to sweep. Keep in step with the tart_worker role's fleet; a host
  # missing here is simply never checked.
  tart_health_hosts:
    - macmini-m4-185.test.releng.mdc1.mozilla.com
    - macmini-m4-186.test.releng.mdc1.mozilla.com
    - macmini-m4-187.test.releng.mdc1.mozilla.com
    - macmini-m4-188.test.releng.mdc1.mozilla.com
    - macmini-m4-189.test.releng.mdc1.mozilla.com
    - macmini-m4-190.test.releng.mdc1.mozilla.com
    - macmini-m4-191.test.releng.mdc1.mozilla.com
    - macmini-m4-192.test.releng.mdc1.mozilla.com
    - macmini-m4-235.test.releng.mdc1.mozilla.com
    - macmini-m4-236.test.releng.mdc1.mozilla.com
    - macmini-m4-237.test.releng.mdc1.mozilla.com
    - macmini-m4-238.test.releng.mdc1.mozilla.com
    - macmini-m4-239.test.releng.mdc1.mozilla.com

