---
ntp_server: time.apple.org

# Puppet agent
puppet_agent:
  package_version: 7.28.0

puppet_run_strategy: cron

# Tart VM host configuration: runs gecko-t-osx-1500-m-vms tester VMs.
# Registry/image differ from the gecko-1b builder hosts (which use 10.49.56.83
# / sequoia-gecko1b-vms). The worker identity is baked into the sequoia-tester
# image, so no host-side vault secrets are required.
#
# manage_image: false  -> puppet does NOT pull/clone. On macOS 15 `tart pull`
#   only works from the console GUI session (Local Network privacy), so the
#   image is seeded once by hand (see tart-provision.sh / the on-host vms.sh)
#   and puppet only manages tart + the launchd unit. This also stops puppet
#   from retry-looping the doomed headless pull (that caused an email storm).
# launchd_type: daemon -> system LaunchDaemon (starts at boot headlessly,
#   survives reboot) instead of a gui-domain LaunchAgent that can't load over
#   ssh on 15.x.
tart:
  version: '2.30.0'
  registry_host: '10.49.56.161'
  registry_port: 5000
  oci_image: 'sequoia-tester'
  oci_tag: 'prod-latest'
  vm_name_prefix: 'sequoia-tester'
  worker_count: 2
  insecure: true
  user: 'admin'
  manage_image: false
  launchd_type: 'daemon'
  # Host-mediated worker-vault injection (see profiles::tart). Keep FALSE until
  # the host has a RENEWING client cert (see cert_source / step_cert_* below).
  # When true, the host fetches vault-<vault_role> from the broker over mTLS and
  # shares it into each VM via `tart run --dir`.
  #
  # ENABLED FLEET-WIDE 2026-07-29, but read the ordering note below before
  # applying puppet on a host that has not been enrolled yet.
  #
  # Proven end to end on macmini-m4-235: both slots run workers whose credentials
  # were never in the image, fetched at launch over mTLS with a self-renewing
  # step-ca cert. mac-794176 registered 2m20s after being cloned from the
  # credential-free prod-latest image; mac-39474a followed.
  #
  # PER-HOST PREREQUISITE — enroll before you apply:
  #   1. mint a token:  relops-bootstrap scripts/mint-tart-enrollment-token.sh <host>
  #   2. drop it at the step_token_file path below
  #   3. then apply puppet; macos_step_cert enrolls, starts the renew daemon, and
  #      chowns the cert to tart.user so tart-run-vm.sh can read it
  #
  # Applying WITHOUT that enrollment is safe but loud, by design: the wrapper
  # finds no readable cert, logs ERROR to syslog, and starts the VM with a plain
  # `tart run` rather than handing the guest an empty vault share. A VM cloned
  # from a BAKED image still registers (it has its own credentials); a VM cloned
  # from the credential-free prod-latest will NOT. So an un-enrolled host keeps
  # working until someone recreates a slot from a current image.
  #
  # Do not set cert_source: 'keychain' with this on. That cert is issued with
  # step-ca's 24h default and nothing renews it, so it buys ~a day and then fails
  # silently (measured 2026-07-27: all of m4-235..239 held SCEP certs 9 days
  # expired).
  inject_vault: true
  vault_role: 'gecko_t_osx_1500_m_vms'
  # TC pool the VMs join. Enables tart-update-vms.sh's per-slot drain (waits for a
  # slot's worker to finish its current task, via the TC public API, before
  # recreating it). Empty elsewhere = mechanical recreate with no drain.
  tc_worker_pool: 'releng-hardware/gecko-t-osx-1500-m-vms'

  # Client identity for the broker fetch: 'keychain' (MDM/SCEP, non-renewing —
  # legacy) or 'file' (PEM pair renewed by macos_step_cert). 'file' is the only
  # supported mode for a host that fetches at runtime; see the long note in
  # profiles::tart for why the keychain identity cannot do this job.
  cert_source: 'file'

  # Self-renewing file-based step-ca identity (macos_step_cert): installs the step
  # CLI, bootstraps CA trust, enrolls from step_token_file when one is present,
  # and runs a renew daemon that also re-chowns the cert to tart.user after each
  # renewal. Enabling this on a host with no token is harmless — enrollment is
  # guarded on the token file existing, so it installs the machinery and waits.
  step_cert_enabled: true
  # step-ca lives in GCP and is reachable from MDC1 by IP only (its name isn't in
  # MDC1 DNS), so pin it in /etc/hosts. TLS still validates against the name.
  step_ca_ip: 34.61.3.27
  step_version: '0.28.2'
  # Where the one-time enrollment token is read from. A FILE, not a hiera/vault
  # value: /var/root/vault.yaml is 0 bytes on these hosts so the vault layer is
  # empty, and a file also keeps the token out of puppet's catalog entirely.
  # Consumed and deleted on successful enrollment. Mint one with
  # relops-bootstrap scripts/mint-tart-enrollment-token.sh and drop it here over
  # the same channel the bootstrap PKG uses for vault.yaml.
  step_token_file: '/var/root/step-enrollment-token'

# step-ca root CA fingerprint — pins trust during `step ca bootstrap`. Non-secret,
# same value the reprovision runner uses. TOP-LEVEL key, not nested under `tart:`
# (see the kcpassword note below for why).
tart_step_ca_fingerprint: f2d8032e35566ecb41b3f1dd5ec7b550fb73f6c8fa855870ca3f35638d777cf6

# Puppet-managed autologin for the VM host (see profiles::tart): base64 of the
# admin user's /etc/kcpassword, enabling an admin GUI session on reboot (required
# for Apple Virtualization Framework / `tart run`). This is a TOP-LEVEL key, NOT
# nested under `tart:` — a secret nested there would shadow the whole tart config
# hash via hiera 'first' merge. Set the real value via vault / a secure override
# only; do NOT commit the credential. Unset/blank = autologin unmanaged.
tart_autologin_kcpassword: ''
