---
ntp_server: time.apple.org

# Common worker metadata conveniently aliased to generic worker data from above
worker_metadata:
  workerId: "%{lookup('gw.worker_id')}"
  workerGroup: "%{lookup('gw.worker_group')}"
  workerType: "%{lookup('gw.worker_type')}"
  provisionerId: "%{lookup('gw.provisioner_id')}"

# Role-owned Taskcluster worker version (read by profiles::worker; takes
# precedence over the legacy vault-sourced worker.taskcluster_version below).
#
# TEMPORARILY pinned back from 100.5.0 to 91.0.2 to validate bug 2073303. The
# Developer-ID-signed assets below only exist for 91.0.2, and signing is a hard
# prerequisite for the SIP-on ScreenCapture grant: on a SIP-on host the csreq
# comes from the MDM PPPC profile and is anchored on identifier + TeamID, which
# an ad-hoc binary (Identifier=a.out, no TeamIdentifier) can never satisfy. With
# the stock ad-hoc staging binaries TCC stores the grant and then rejects the
# caller at evaluation time, so staging could not exercise the fix at all.
#
# REVERT THIS (and taskcluster_signed_binaries below) once validation is done --
# this key is what the monthly worker-version bump-bot drives, and staging is
# the only pool that exercises new worker versions. Leaving it pinned silently
# removes that coverage.
taskcluster_version: '91.0.2'

# Developer-ID-signed worker binaries (Mozilla TeamID 43AQ936H96), as
# installed-binary-name => sha256 of the signed asset. Digests verified against
# the signed/ prefix of the ronin package bucket and identical to the ones the
# prod gecko_t_osx_1500_m4 role pins. See the note above before changing.
taskcluster_signed_binaries:
  start-worker: 'c43aaf3361ea356a730d9cdb322364d765a06f77222104ad3ea2d5dc6a8913f5'
  generic-worker-multiuser: '3e2e5410959c3652f89751be9863a07e050beb6a28beb7522a5122b871fb8487'

worker:
  taskcluster_version: 95.0.3
  provider_type: standalone
  worker_pool_id: releng-hardware/gecko-t-osx-1500-m4-staging
  worker_group: mdc1
  worker_id: "%{facts.networking.hostname}"
  client_id: "%{lookup('vault_secrets::generic_worker.data.taskcluster_client_id')}"
  access_token: "%{lookup('vault_secrets::generic_worker.data.taskcluster_access_token')}"
  generic_worker_engine: multiuser-static
  idle_timeout_secs: 21600 # 6 hours

packages_classes:
  - git
  - mercurial
  - nodejs
  - python3
  - python3_psutil
  - python3_pyobjc
  - python3_yaml
  - python3_zstandard
  - safari_preview
  - scres
  - telegraf
  - tooltool
  - virt_audio_s3
  - virtualenv
  - wget
  - zstandard

# Package class parameters
packages::git::version: 2.47.1
packages::mercurial::version: 6.4.5
packages::nodejs::version: 12.11.1
packages::python3::version: 3.11.0
packages::python3_zstandard::version: 0.22.0
packages::virtualenv::version: 16.4.3
packages::wget::version: 1.20.3_1
packages::zstandard::version: 1.3.8
packages::telegraf::version: 1.19.0
packages::virt_audio_s3::version: 0.5.0

# Talos class parameters
talos::user: cltbld

# Determines how puppet should be executed
# ( atboot, cron, never )
puppet_run_strategy: never

# Firewall role to include
#firewall_role: osx_taskcluster_worker

# Override secrets with vault secrets
telegraf:
    user: "%{lookup('vault_secrets::telegraf.data.user')}"
    password: "%{lookup('vault_secrets::telegraf.data.password')}"

cltbld_user:
    password: "%{lookup('vault_secrets::cltbld_user.data.password')}"
    salt: "%{lookup('vault_secrets::cltbld_user.data.salt')}"
    iterations: "%{lookup('vault_secrets::cltbld_user.data.iterations')}"
    kcpassword: "%{lookup('vault_secrets::cltbld_user.data.kcpassword')}"
    unhashedpassword: "%{lookup('vault_secrets::cltbld_user.data.unhashedpassword')}"

generic_worker_secrets:
    taskcluster_client_id: "%{lookup('vault_secrets::generic_worker.data.taskcluster_client_id')}"
    taskcluster_access_token: "%{lookup('vault_secrets::generic_worker.data.taskcluster_access_token')}"
