version: 2
multi-ecosystem-groups:
  ci-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
    target-branch: "master"
    commit-message:
      prefix: "deps"
      include: "scope"

updates:
  # Ruby dependencies, including module Gemfiles
  - package-ecosystem: "bundler"
    directories: ["/**"]
    exclude-paths:
      - "**/r10k_modules/**"
      - "**/vendor/**"
    patterns: ["*"]
    multi-ecosystem-group: "ci-dependencies"
    labels:
      - "dependencies"
      - "ruby"

  # Python dependencies
  - package-ecosystem: "pip"
    directories: ["/**"]
    exclude-paths:
      - "**/r10k_modules/**"
      - "**/vendor/**"
    patterns: ["*"]
    multi-ecosystem-group: "ci-dependencies"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - "**/r10k_modules/**"
      - "**/vendor/**"
    patterns: ["*"]
    multi-ecosystem-group: "ci-dependencies"
    labels:
      - "dependencies"
      - "github-actions"
