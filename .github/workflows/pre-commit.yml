name: Pre-commit

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check direct hardware Chrome updates
      shell: pwsh
      run: ./test/test_update_google_chrome.ps1

    - name: Check direct Windows Kitchen Git bootstrap
      shell: pwsh
      run: ./test/test_windows_bootstrap_git.ps1

    - name: Check fleetbench pin and alpha policy
      shell: pwsh
      run: ./test/fleetbench_pin.ps1

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.336.0

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.11'

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4.0.1

    - name: Test Linux Puppet Git recovery and auth fallback
      shell: bash
      run: bash test/test_run_puppet_git_recovery.sh

    - name: Test Linux bootstrap
      shell: bash
      run: bash test/test_bootstrap_linux.sh

    - name: Test Bitbar release package bootstrap
      shell: bash
      run: bash test/test_bootstrap_bitbar_release.sh

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Cache pre-commit environments
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.ruby-version') }}

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v47.0.6
      with:
        files_ignore: |
          r10k_modules/**

    - name: Run pre-commit on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      env:
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      shell: bash
      run: |
        echo "Running pre-commit on changed files:"
        echo "${CHANGED_FILES}" | tr ' ' '\n'
        # shellcheck disable=SC2086
        pre-commit run --files ${CHANGED_FILES}

    - name: Skip pre-commit if no relevant files changed
      if: steps.changed-files.outputs.any_changed == 'false'
      run: |
        echo "No relevant files changed (excluding r10k_modules/), skipping pre-commit"

  snmpd-permissions:
    name: Container service integration tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Test SNMP permissions in disposable Ubuntu container
      run: bash test/docker/snmpd-permissions/run.sh
