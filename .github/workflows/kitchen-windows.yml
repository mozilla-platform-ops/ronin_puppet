name: Kitchen Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.role }} (${{ matrix.worker_pool_id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: win116425h2azure
            worker_pool_id: win11-64-25h2-alpha
            kitchen_instance: windows-win11-64-25h2
          - role: win116425h2azure
            worker_pool_id: win11-64-25h2-amd-v7-kitchen
            kitchen_instance: windows-win11-64-25h2-amd-v7
          - role: win116425h2azure
            worker_pool_id: win11-64-25h2-gpu-alpha
            kitchen_instance: windows-win11-64-25h2-gpu
          - role: win116424h2azure
            worker_pool_id: win11-64-24h2-alpha
            kitchen_instance: windows-win11-64-24h2
          - role: win11a6425h2azurebuilder
            worker_pool_id: win11-a64-25h2-builder
            kitchen_instance: windows-win11-a64-25h2-builder
          - role: win11a6425h2azuretester
            worker_pool_id: win11-a64-25h2-tester
            kitchen_instance: windows-win11-a64-25h2-tester
          - role: win2022642009azure
            worker_pool_id: b-win2022
            kitchen_instance: windows-win2022-64-2009
          - role: win10642009azure
            worker_pool_id: win10-64-2009
            kitchen_instance: windows-win10-64-2009
          - role: win10642009azure
            worker_pool_id: win10-64-2009-gpu-alpha
            kitchen_instance: windows-win10-64-2009-gpu
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: false

      - name: Cache gems
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.gem
          key: v1-gems-${{ runner.os }}-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}

      - name: Bundle install
        run: |
          bundle install

      - name: Generate ephemeral Windows admin password
        shell: bash
        run: |
          password="Tk$(openssl rand -hex 24)!a9"
          echo "::add-mask::$password"
          echo "KITCHEN_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Kitchen test
        timeout-minutes: 120
        env:
          KITCHEN_YAML: .kitchen_configs/kitchen.windows.yml
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          KITCHEN_ADMIN_PASSWORD: ${{ env.KITCHEN_ADMIN_PASSWORD }}
          PUPPET_ROLE: ${{ matrix.role }}
          WORKER_POOL_ID: ${{ matrix.worker_pool_id }}
          RONIN_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          max_attempts=3
          is_transient_azure_failure() {
            local log_file="$1"

            # Retry only failures that indicate the Azure VM was evicted or
            # became unreachable. Puppet convergence failures need a code or
            # dependency fix; a new VM will reproduce them.
            grep -Eqi \
              'execution expired|WinRM::WinRMHTTPTransportError|Errno::(ECONNREFUSED|ECONNRESET|ETIMEDOUT)|OperationPreempted|evict(ed|ion)?|AllocationFailed|OverconstrainedAllocationRequest|SkuNotAvailable|InternalServerError' \
              "$log_file"
          }

          for attempt in $(seq 1 $max_attempts); do
            echo "=== Attempt $attempt of $max_attempts ==="
            attempt_log="${RUNNER_TEMP}/kitchen-${{ matrix.kitchen_instance }}-attempt-${attempt}.log"
            set +e
            bundle exec kitchen test ${{ matrix.kitchen_instance }} -l debug 2>&1 | tee "$attempt_log"
            kitchen_status=${PIPESTATUS[0]}
            set -e
            if [ "$kitchen_status" -eq 0 ]; then
              exit 0
            fi

            if ! is_transient_azure_failure "$attempt_log"; then
              echo "::error::Kitchen failed without a recognized Azure/WinRM transient error; not retrying."
              exit "$kitchen_status"
            fi

            echo "::warning::Attempt $attempt failed with a recognized Azure/WinRM transient error"
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Destroying failed instance before retry..."
              bundle exec kitchen destroy ${{ matrix.kitchen_instance }} -l debug || true
            fi
          done
          echo "::error::All $max_attempts attempts failed"
          exit 1

      - name: Kitchen destroy
        if: always()
        env:
          KITCHEN_YAML: .kitchen_configs/kitchen.windows.yml
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          KITCHEN_ADMIN_PASSWORD: ${{ env.KITCHEN_ADMIN_PASSWORD }}
          PUPPET_ROLE: ${{ matrix.role }}
          WORKER_POOL_ID: ${{ matrix.worker_pool_id }}
          RONIN_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bundle exec kitchen destroy ${{ matrix.kitchen_instance }} -l debug
