name: r10k

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  r10k-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: false

      - name: Cache gems
        uses: actions/cache@v6.1.0
        with:
          path: ~/.gem
          key: v1-gems-${{ runner.os }}-${{ hashFiles('.ruby-version', 'Gemfile.lock') }}

      - name: Bundle install
        run: |
          gem install bundler:2.5.23
          bundle install

      - name: r10k puppetfile install
        run: bundle exec r10k puppetfile install --moduledir=r10k_modules -v --force

      - name: Check Windows Git fallback catalogs
        run: bundle exec ruby test/test_windows_git_fallback.rb
