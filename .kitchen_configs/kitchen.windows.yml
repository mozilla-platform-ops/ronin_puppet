        - test/integration/<%= ENV['PUPPET_ROLE'] %>/serverspec/*_spec.rb
      default_pattern: false
      extra_flags: --format RspecJunitFormatter -o <%= File.join(Dir.pwd, 'test-results', 'rspec.xml') %>
    includes:
      - win11-64-24h2
      - win11-64-25h2
      - win11-64-25h2-amd-v7
      - win11-64-25h2-gpu
      - win11-a64-25h2-builder
      - win11-a64-25h2-tester
