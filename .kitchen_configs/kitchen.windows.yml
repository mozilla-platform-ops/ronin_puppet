    lifecycle:
      post_converge:
        - remote: shutdown.exe /r /t 5 /f
      pre_verify:
        - local: |
            reboot_started=false
            for attempt in $(seq 1 30); do
              if ! timeout 1 bash -c "</dev/tcp/$KITCHEN_INSTANCE_HOSTNAME/5985" 2>/dev/null; then
                reboot_started=true
                break
              fi
              sleep 2
            done
            $reboot_started || exit 1
            for attempt in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/$KITCHEN_INSTANCE_HOSTNAME/5985" 2>/dev/null; then
                exit 0
              fi
              sleep 10
            done
            exit 1

suites:
